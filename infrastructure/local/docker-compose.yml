name: fuel-queue-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fuel_queue
      POSTGRES_USER: fuel_queue
      POSTGRES_PASSWORD: fuel_queue
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fuel_queue -d fuel_queue']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: infrastructure/local/Dockerfile.api
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://fuel_queue:fuel_queue@postgres:5432/fuel_queue
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: local-development-access-secret-must-be-changed
      JWT_REFRESH_SECRET: local-development-refresh-secret-must-be-changed
      OTP_HASH_SECRET: local-development-otp-hash-secret-must-be-changed
      LOG_LEVEL: debug
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/local/Dockerfile.worker
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://fuel_queue:fuel_queue@postgres:5432/fuel_queue
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: local-development-access-secret-must-be-changed
      JWT_REFRESH_SECRET: local-development-refresh-secret-must-be-changed
      OTP_HASH_SECRET: local-development-otp-hash-secret-must-be-changed
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
